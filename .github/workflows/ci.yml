name: CI Pipeline

on:
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Use Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Install dependencies
        run: npm install

      - name: Build (optional)
        run: echo "Build step (Node.js app)"

      - name: Fix permissions
        run: chmod +x ./node_modules/.bin/jest

      - name: Run tests
        run: npm test